{% extends "admin/layout.html" %}
{% block page_title %}New bill{% endblock %}
{% block content %}
<form method="post" id="billForm">
  <div class="row g-3">
    <div class="col-md-4">
      <label class="form-label">Customer</label>
      <select class="form-select" name="customer_id" required>{% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select>
    </div>
    <div class="col-md-2">
      <label class="form-label">Discount %</label>
      <input class="form-control" type="number" step="0.01" name="discount_percent" value="0" id="disc">
    </div>
    <div class="col-md-2">
      <label class="form-label">Tax %</label>
      <input class="form-control" type="number" step="0.01" name="tax_percent" value="0" id="tax">
    </div>
    <div class="col-md-4">
      <label class="form-label">Notes</label>
      <input class="form-control" name="notes" placeholder="Optional">
    </div>
  </div>
  <hr>
  <h6 class="text-muted">Line items</h6>
  <div class="table-responsive">
    <table class="table" id="linesTable">
      <thead><tr><th>Medicine</th><th>Qty</th><th>Price</th><th>Line</th></tr></thead>
      <tbody>
        {% for i in range(12) %}
        <tr class="line-row">
          <td><select class="form-select form-select-sm med-select" name="medicine_id"><option value="">—</option>{% for m in medicines %}<option value="{{ m.id }}" data-price="{{ m.selling_price }}">{{ m.name }} ({{ m.batch_number }}) — {{ m.quantity }} avail</option>{% endfor %}</select></td>
          <td style="width:90px"><input type="number" class="form-control form-control-sm qty-inp" name="qty" min="0" value="0"></td>
          <td class="price-cell small text-muted">—</td>
          <td class="line-cell small">—</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  <div class="row mb-3">
    <div class="col-md-6 offset-md-6">
      <div class="card card-soft p-3">
        <div class="d-flex justify-content-between"><span>Subtotal</span><span id="subDisplay">₹ 0.00</span></div>
        <div class="d-flex justify-content-between"><span>Discount</span><span id="discDisplay">₹ 0.00</span></div>
        <div class="d-flex justify-content-between"><span>Tax</span><span id="taxDisplay">₹ 0.00</span></div>
        <hr class="my-2">
        <div class="d-flex justify-content-between fw-bold"><span>Grand total</span><span id="grandDisplay">₹ 0.00</span></div>
      </div>
    </div>
  </div>
  <button type="submit" class="btn btn-primary btn-lg">Save &amp; print</button>
  <a href="{{ url_for('admin.billing_list') }}" class="btn btn-outline-secondary btn-lg">Cancel</a>
</form>
{% endblock %}
{% block scripts %}
<script>
(function(){
  function num(el){ return parseFloat(el.value) || 0; }
  function recalc(){
    let sub = 0;
    document.querySelectorAll('.line-row').forEach(function(row){
      const sel = row.querySelector('.med-select');
      const q = num(row.querySelector('.qty-inp'));
      const opt = sel.options[sel.selectedIndex];
      const price = opt && opt.dataset.price ? parseFloat(opt.dataset.price) : 0;
      const line = price * q;
      sub += line;
      row.querySelector('.price-cell').textContent = price ? '₹ ' + price.toFixed(2) : '—';
      row.querySelector('.line-cell').textContent = line ? '₹ ' + line.toFixed(2) : '—';
    });
    const d = num(document.getElementById('disc'));
    const t = num(document.getElementById('tax'));
    const discAmt = sub * d / 100;
    const after = sub - discAmt;
    const taxAmt = after * t / 100;
    const grand = after + taxAmt;
    document.getElementById('subDisplay').textContent = '₹ ' + sub.toFixed(2);
    document.getElementById('discDisplay').textContent = '₹ ' + discAmt.toFixed(2);
    document.getElementById('taxDisplay').textContent = '₹ ' + taxAmt.toFixed(2);
    document.getElementById('grandDisplay').textContent = '₹ ' + grand.toFixed(2);
  }
  document.getElementById('linesTable').addEventListener('change', recalc);
  document.getElementById('disc').addEventListener('input', recalc);
  document.getElementById('tax').addEventListener('input', recalc);
  recalc();
})();
</script>
{% endblock %}
