{% extends "admin/layout.html" %}
{% block page_title %}Change password{% endblock %}
{% block content %}
<div class="card card-soft p-4" style="max-width:480px">
  <form method="post">
    <div class="mb-3"><label class="form-label">Current password</label><input type="password" name="current" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">New password</label><input type="password" name="new" class="form-control" required minlength="6"></div>
    <div class="mb-3"><label class="form-label">Confirm</label><input type="password" name="confirm" class="form-control" required></div>
    <button type="submit" class="btn btn-primary">Update password</button>
  </form>
</div>
{% endblock %}
