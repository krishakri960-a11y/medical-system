{% extends "admin/layout.html" %}{% block page_title %}Daily billing report{% endblock %}{% block content %}
<form class="row g-2 mb-3 no-print" method="get"><div class="col-auto"><input type="date" class="form-control" name="day" value="{{ day }}"></div><div class="col-auto"><button class="btn btn-primary" type="submit">Go</button></div><div class="col-auto"><button class="btn btn-outline-secondary" type="button" onclick="window.print()">Print</button></div></form>
<div class="card card-soft table-responsive"><table class="table table-sm mb-0"><thead><tr><th>Bill</th><th>Customer</th><th class="text-end">Total</th></tr></thead><tbody>
{% for b in rows %}<tr><td>{{ b.bill_number }}</td><td>{{ b.customer.name }}</td><td class="text-end">₹ {{ '%.2f'|format(b.grand_total|float) }}</td></tr>{% else %}<tr><td colspan="3">None.</td></tr>{% endfor %}
</tbody></table></div>{% endblock %}
