{% extends "admin/layout.html" %}{% block page_title %}Report · Customers{% endblock %}{% block content %}
<button class="btn btn-sm btn-primary mb-3 no-print float-end" onclick="window.print()">Print</button>
<div class="card card-soft table-responsive"><table class="table table-sm mb-0"><thead><tr><th>Name</th><th>Phone</th><th>Email</th></tr></thead><tbody>
{% for c in rows %}<tr><td>{{ c.name }}</td><td>{{ c.contact_number }}</td><td>{{ c.email }}</td></tr>{% else %}<tr><td colspan="3">None.</td></tr>{% endfor %}
</tbody></table></div>{% endblock %}
