{% extends "staff/layout.html" %}
{% block breadcrumb %}Account · Security{% endblock %}
{% block page_title %}Change password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card card-soft p-4">
      <p class="text-muted small mb-4">Use at least 6 characters. You will return to the dashboard after a successful change.</p>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Current password</label>
          <input type="password" name="current" class="form-control" required autocomplete="current-password">
        </div>
        <div class="mb-3">
          <label class="form-label">New password</label>
          <input type="password" name="new" class="form-control" required minlength="6" autocomplete="new-password">
        </div>
        <div class="mb-4">
          <label class="form-label">Confirm new password</label>
          <input type="password" name="confirm" class="form-control" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-staff-brand">Update password</button>
        <a href="{{ url_for('staff.dashboard') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
