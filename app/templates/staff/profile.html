{% extends "staff/layout.html" %}
{% block breadcrumb %}Account · Profile{% endblock %}
{% block page_title %}My profile{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card card-soft p-4">
      <p class="text-muted small mb-4">These details appear on receipts and internal reports.</p>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Full name</label>
          <input class="form-control" name="full_name" value="{{ current_user.full_name }}" required autocomplete="name">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" name="email" value="{{ current_user.email or '' }}" autocomplete="email">
        </div>
        <div class="mb-4">
          <label class="form-label">Phone</label>
          <input class="form-control" name="phone" value="{{ current_user.phone or '' }}" autocomplete="tel">
        </div>
        <div class="d-flex flex-wrap gap-2 align-items-center">
          <button type="submit" class="btn btn-staff-brand">Save profile</button>
          <span class="small text-muted">Username: <strong>{{ current_user.username }}</strong> (managed by admin)</span>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
